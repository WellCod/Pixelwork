name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions fixadas por SHA (a tag ao lado é só referência); o Dependabot propõe as atualizações.
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: coworking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/coworking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: catálogo em dia com o manifesto
        run: pnpm assets:catalog && git diff --exit-code packages/shared/src/catalog.generated.ts
      - name: migrations em dia com o schema
        run: pnpm db:generate && git diff --exit-code packages/server/drizzle
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm assets:check
      - run: pnpm test

  docker:
    # As imagens de produção são construídas a cada mudança, para o Dockerfile não apodrecer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build --target app -t pixelwork-app .
      - run: docker build --target web -t pixelwork-web .

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: coworking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Service container não aceita argumentos; o LiveKit precisa de --dev --bind 0.0.0.0.
      - name: livekit
        run: |
          docker run -d --name livekit -p 7880:7880 -p 7881:7881 -p 7882:7882/udp \
            livekit/livekit-server:v1.13.11 --dev --bind 0.0.0.0
          for i in $(seq 1 30); do curl -sf http://localhost:7880 >/dev/null && exit 0; sleep 1; done
          docker logs livekit; exit 1
      - run: cp .env.example .env
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: cache dos navegadores do Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: relatório e traces quando falha
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
